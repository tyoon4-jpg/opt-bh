<!--
  CIP_Beam_Optimizer.html -- PRD Section 7.3/7.4 standalone deliverable.

  Self-contained, build-tool-free React app (React + Babel via CDN). Opens
  directly in a browser -- no npm install, no bundler. Requires an internet
  connection (or an intranet CDN mirror) to load the three CDN scripts below;
  once loaded, all calculation logic runs entirely client-side.

  Implements:
    Tab 1 - CIP Beam Optimizer: the Phase 1 workflow (PRD Section 5) --
      geometric net-diagonal fit + AISC 360 / EN 1993-1-1 / KS capacity
      checks, mirrored 1:1 from optimized_beam_aisc.py and
      optimized_steel_beam.py so results match the Python grid search for
      the same inputs (PRD acceptance criteria, Section 9).
    Tab 2 - Beam Section Property Calculator (PRD Section 7.4): H, B, tw,
      tf, plus either z (built-up min. weld leg size, throat a = 0.7z
      shown for reference) or r (rolled root fillet radius, concave
      "spandrel" model) -> full section property set for either beam type.

  Every simplification carried over from the Python scripts is called out
  inline (Section 6.3 LTB approximation, Section 6.2 shear-area formula,
  KS-mirrors-EN formulation, indicative catalog properties). See the
  companion PRD and Python files for the full derivation and disclaimers.
-->

function netDiagonal(holeMM, allowMM, basis) {
  return basis === "per_side" ? holeMM - 2 * allowMM : holeMM - allowMM;
}

// ---- AISC 360 Chapter F2 / G2.1 / H1 ------------------------------------
function aiscFlexure(s, Fy, LbIn, Cb = 1.0) {
  const Mp = Fy * s.Zx;
  const Lp = 1.76 * s.ry * Math.sqrt(E_AISC_KSI / Fy);
  const Lr = Math.PI * s.ry * Math.sqrt(E_AISC_KSI / (0.7 * Fy)); // simplified, PRD 6.3
  let Mn, regime;
  if (LbIn <= Lp) { Mn = Mp; regime = "plastic (Lb≤Lp)"; }
  else if (LbIn <= Lr) {
    Mn = Cb * (Mp - (Mp - 0.7 * Fy * s.Sx) * (LbIn - Lp) / (Lr - Lp));
    Mn = Math.min(Mn, Mp); regime = "inelastic LTB";
  } else {
    Mn = Cb * Mp * Math.pow(Lr / LbIn, 2);
    Mn = Math.min(Mn, Mp); regime = "elastic LTB (approx.)";
  }
  return { Mp, Lp, Lr, Mn, phiMn: 0.90 * Mn, regime };
}
function aiscShear(s, Fy) {
  const Aw = s.d * s.tw;
  const Vn = 0.6 * Fy * Aw;
  return { Aw, Vn, phiVn: 0.90 * Vn };
}
function aiscCompression(s, Fy, KL) {
  let Fcr;
  if (KL <= 0) Fcr = Fy;
  else {
    const Fe = Math.pow(Math.PI, 2) * E_AISC_KSI / Math.pow(KL / s.ry, 2);
    Fcr = (Fy / Fe <= 2.25) ? Math.pow(0.658, Fy / Fe) * Fy : 0.877 * Fe;
  }
  const Pn = Fcr * s.A;
  return { Fcr, Pn, phiPn: 0.90 * Pn };
}
function aiscH1(Pr, Pc, Mr, Mc) {
  const ratioP = Pc > 0 ? Pr / Pc : Infinity;
  let util, eq;
  if (ratioP >= 0.2) { util = ratioP + (8 / 9) * (Mr / Mc); eq = "H1-1a"; }
  else { util = ratioP / 2 + (Mr / Mc); eq = "H1-1b"; }
  return { utilization: util, equation: eq, passes: util <= 1.0 };
}

// ---- EN 1993-1-1 sec 6.2.5/6.2.6/6.2.8/6.2.9/6.3.2 (KS mirrors this) ----
function enShearAreaMM2(Acm2, bMM, tfMM, twMM) { return Acm2 * 100 - 2 * bMM * tfMM + twMM * tfMM; }
function enBendingResistance(WplCm3, fy) { return (WplCm3 * 1e3 * fy) / 1e6; } // kN*m
function enShearResistance(AvMM2, fy) { return (AvMM2 * (fy / Math.sqrt(3))) / 1e3; } // kN
function enBendingShearInteraction(VEd, VplRd, WplCm3, AvMM2, twMM, fy) {
  if (VEd <= 0.5 * VplRd) return enBendingResistance(WplCm3, fy);
  const rho = Math.pow(2 * VEd / VplRd - 1, 2);
  const WplMM3 = WplCm3 * 1e3;
  const reduced = WplMM3 - rho * Math.pow(AvMM2, 2) / (4 * twMM);
  return (reduced * fy) / 1e6;
}
function enAxialFlexure(NEd, Acm2, bMM, tfMM, fy, McRd) {
  const AMM2 = Acm2 * 100;
  const NplRd = (AMM2 * fy) / 1e3;
  const n = NplRd > 0 ? NEd / NplRd : Infinity;
  const aw = Math.min((AMM2 - 2 * bMM * tfMM) / AMM2, 0.5);
  const MNyRd = n <= aw ? McRd : McRd * (1 - n) / (1 - 0.5 * aw);
  return { n, aw, MNyRd, NplRd };
}
function enLtbMcr(IzCm4, hMM, tfMM, LcrMM, C1 = 1.0) {
  if (LcrMM <= 0) return Infinity;
  const IzMM4 = IzCm4 * 1e4;
  const IwMM6 = IzMM4 * Math.pow(hMM - tfMM, 2) / 4.0;
  const McrNmm = C1 * Math.pow(Math.PI, 2) * E_SI_MPA * Math.sqrt(IzMM4 * IwMM6) / Math.pow(LcrMM, 2);
  return McrNmm / 1e6;
}
function enBendingBuckling(WplCm3, fy, LcrMM, IzCm4, hMM, tfMM) {
  const McRd = enBendingResistance(WplCm3, fy);
  if (LcrMM <= 0) return { MbRd: McRd, chiLT: 1.0, Mcr: Infinity };
  const Mcr = enLtbMcr(IzCm4, hMM, tfMM, LcrMM);
  const lambdaLT = Math.sqrt(McRd / Mcr);
  const phiLT = 0.5 * (1 + ALPHA_LT * (lambdaLT - 0.2) + Math.pow(lambdaLT, 2));
  let chiLT = 1 / (phiLT + Math.sqrt(Math.max(Math.pow(phiLT, 2) - Math.pow(lambdaLT, 2), 0)));
  chiLT = Math.min(chiLT, 1.0);
  return { MbRd: (chiLT * WplCm3 * 1e3 * fy) / 1e6, chiLT, Mcr };
}

// ---- unified per-section evaluation --------------------------------------
function evaluateSection(code, s, inp, dNet) {
  let diagonal, fits, MbService, MbConstr, Av, VplRd, weightOrMass;

  if (code === "AISC") {
    diagonal = Math.hypot(s.d, s.bf) * MM_PER_IN;
    fits = diagonal <= dNet;
    const LbServiceIn = inp.LbService / MM_PER_IN;
    const LbConstrIn = inp.LbConstruction / MM_PER_IN;
    MbService = aiscFlexure(s, inp.fy, LbServiceIn);
    MbConstr = inp.LbConstruction > 0 ? aiscFlexure(s, inp.fy, LbConstrIn) : null;
    const shear = aiscShear(s, inp.fy);
    Av = shear.Aw; VplRd = shear.phiVn;
    weightOrMass = s.weight;
  } else {
    diagonal = Math.hypot(s.h, s.b);
    fits = diagonal <= dNet;
    const Wpl = code === "EN" ? s.Wply : s.Zx;
    const Iweak = code === "EN" ? s.Iz : s.Iy;
    MbService = enBendingBuckling(Wpl, inp.fy, 0, Iweak, s.h, s.tf);
    MbConstr = inp.LbConstruction > 0 ? enBendingBuckling(Wpl, inp.fy, inp.LbConstruction, Iweak, s.h, s.tf) : null;
    Av = enShearAreaMM2(s.A, s.b, s.tf, s.tw);
    VplRd = enShearResistance(Av, inp.fy);
    weightOrMass = s.mass;
  }

  let governing, stage;
  const svcCap = code === "AISC" ? MbService.phiMn : MbService.MbRd;
  const constrCap = MbConstr ? (code === "AISC" ? MbConstr.phiMn : MbConstr.MbRd) : Infinity;
  if (MbConstr && constrCap < svcCap) { governing = MbConstr; stage = "Construction (unbraced)"; }
  else { governing = MbService; stage = "Grout-braced (in-service)"; }

  let capacity = code === "AISC" ? governing.phiMn : governing.MbRd;

  if (code !== "AISC" && inp.VEd > 0.5 * VplRd) {
    const Wpl = code === "EN" ? s.Wply : s.Zx;
    const interacted = enBendingShearInteraction(inp.VEd, VplRd, Wpl, Av, s.tw, inp.fy);
    capacity = Math.min(capacity, interacted);
  }

  const demandM = code === "AISC" ? inp.Mu : inp.MEd;
  const demandV = code === "AISC" ? inp.Vu : inp.VEd;
  const demandP = code === "AISC" ? inp.Pu : inp.NEd;

  let utilFlex = capacity > 0 ? demandM / capacity : Infinity;
  const utilShear = VplRd > 0 ? demandV / VplRd : Infinity;

  let interaction = null;
  if (demandP > 0) {
    if (code === "AISC") {
      const KL = Math.max(governing === MbConstr ? inp.LbConstruction : inp.LbService, 25.4) / MM_PER_IN;
      const comp = aiscCompression(s, inp.fy, KL);
      interaction = aiscH1(demandP, comp.phiPn, demandM, capacity);
      utilFlex = interaction.utilization;
    } else {
      interaction = enAxialFlexure(demandP, s.A, s.b, s.tf, inp.fy, capacity);
      utilFlex = interaction.MNyRd > 0 ? demandM / interaction.MNyRd : Infinity;
    }
  }

  const passes = fits && utilFlex <= 1.0 && utilShear <= 1.0;

  return { section: s, name: s.name, weightOrMass, diagonal, fits, stage, utilFlex, utilShear, passes };
}

function optimize(code, inp) {
  const dNet = netDiagonal(inp.holeDia, inp.allowance, inp.allowanceBasis);
  const library = code === "AISC" ? AISC_LIBRARY : code === "EN" ? EN_LIBRARY : code === "KS" ? KS_LIBRARY : builtUpLibrary();
  const results = library.map(s => evaluateSection(code, s, inp, dNet));
  const admissible = results.filter(r => r.passes).sort((a, b) => a.weightOrMass - b.weightOrMass);
  return { dNet, results, admissible };
}

// Computed "catalog" for the BUILTUP design-code option -- grid-searches H
// per the proportional design rule (bf=0.55H, tf=H/30, tw=H/50, per CLAUDE.md
// / the Beam Section Properties tab) at a fixed min. weld leg z=6mm, using
// builtUpProperties() (defined later in this file -- safe, function
// declarations are hoisted module-wide). Converts its mm-native output into
// the cm/mm field set evaluateSection()'s non-AISC (KS-style) branch expects:
// A mm^2->cm^2 (/100), Zx mm^3->cm^3 (/1000), Iy mm^4->cm^4 (/1e4); h,b,tw,tf
// stay in mm. This lets BUILTUP reuse evaluateSection/optimize/FitDiagram
// completely unchanged, since neither special-cases "EN"/"KS" by name --
// they branch only on "is it AISC," so any KS-shaped candidate works.
function builtUpLibrary() {
  const z = 6; // mm, default min. weld leg size (matches SectionPropertyTab default)
  const library = [];
  for (let H = 250; H <= 600; H += 10) {
    const B = 0.55 * H;
    const tf = H / 30;
    const tw = H / 50;
    const p = builtUpProperties(H, B, tw, tf, z);
    const name = `BH-${H}x${+B.toFixed(1)}x${+tw.toFixed(1)}x${+tf.toFixed(1)}`; // matches KS "H-HxBxtwxtf" convention, "BH" = built-up H
    library.push({ name, mass: p.weight, h: H, b: B, tw, tf, A: p.A / 100, Zx: p.Zx / 1000, Iy: p.Iy / 1e4 });
  }
  return library;
}

/* ============================================================================
   PHASE 2 -- BAYESIAN REFINEMENT PROTOTYPE (PRD Section 7.2)
   Mirrors bayesian_optimization.py term-for-term: same continuous (d, bf)
   proxy design (tf=d/30, tw=d/50, thin-wall, NO weld -- distinct from the
   weld-inclusive builtUpProperties() model used in the Section Properties
   tab below), same penalized-weight objective, same RBF-kernel GP + LCB
   acquisition loop. Linear algebra (Gauss-Jordan inverse) is hand-rolled
   here instead of numpy -- still no third-party dependency.
   Status: illustrative Phase 2 seed, not wired into Phase 1 acceptance
   criteria (same caveat as the Python prototype).
   ========================================================================= */
const STEEL_DENSITY_KG_MM3 = 7.85e-6;

function proxyDesign(d, bf) {
  const tf = d / 30.0, tw = d / 50.0;
  const A = 2 * bf * tf + (d - 2 * tf) * tw;
  const weight = A * STEEL_DENSITY_KG_MM3 * 1000.0; // kg/m
  const Ix = (bf * Math.pow(d, 3)) / 12 - ((bf - tw) * Math.pow(d - 2 * tf, 3)) / 12;
  const Zx = bf * tf * (d - tf) + (tw * Math.pow(d - 2 * tf, 2)) / 4;
  const diagonal = Math.hypot(d, bf);
  return { d, bf, tf, tw, A, weight, Ix, Zx, diagonal };
}

function proxyEvaluate(d, bf, problem) {
  const des = proxyDesign(d, bf);
  const MpKNm = (problem.fy * des.Zx) / 1e6; // fy MPa, Zx mm^3 -> N*mm -> kN*m
  const fitViolation = Math.max(0, des.diagonal - problem.dNet) / problem.dNet;
  const capViolation = Math.max(0, problem.mDemand - MpKNm) / Math.max(problem.mDemand, 1e-6);
  const penalty = problem.penaltyWeight * (fitViolation + capViolation);
  const objective = des.weight + penalty;
  const feasible = fitViolation === 0 && capViolation === 0;
  return { design: des, MpKNm, objective, feasible, fitViolation, capViolation };
}

// ---- tiny linear algebra (Gauss-Jordan inverse, plain 2D arrays) --------
function matInverse(M) {
  const n = M.length;
  const A = M.map((row, i) => row.concat(Array.from({ length: n }, (_, j) => (i === j ? 1 : 0))));
  for (let col = 0; col < n; col++) {
    let pivot = col;
    for (let r = col + 1; r < n; r++) if (Math.abs(A[r][col]) > Math.abs(A[pivot][col])) pivot = r;
    const tmp = A[col]; A[col] = A[pivot]; A[pivot] = tmp;
    const pv = A[col][col] || 1e-12;
    for (let j = 0; j < 2 * n; j++) A[col][j] /= pv;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const factor = A[r][col];
      if (factor === 0) continue;
      for (let j = 0; j < 2 * n; j++) A[r][j] -= factor * A[col][j];
    }
  }
  return A.map(row => row.slice(n));
}
function matVec(M, v) { return M.map(row => row.reduce((s, val, i) => s + val * v[i], 0)); }

// ---- minimal RBF-kernel Gaussian Process (zero-mean, single length scale) --
class SimpleGP {
  constructor(lengthScale, sigmaF = 1.0, noise = 1e-3) {
    this.lengthScale = lengthScale; this.sigmaF = sigmaF; this.noise = noise;
  }
  kernel(A, B) {
    return A.map(a => B.map(b => {
      const sq = Math.pow(a[0] - b[0], 2) + Math.pow(a[1] - b[1], 2);
      return Math.pow(this.sigmaF, 2) * Math.exp(-0.5 * sq / Math.pow(this.lengthScale, 2));
    }));
  }
  fit(X, y) {
    this.X = X;
    this.yMean = y.reduce((a, b) => a + b, 0) / y.length;
    this.y = y.map(v => v - this.yMean);
    const K = this.kernel(X, X).map((row, i) => row.map((v, j) => v + (i === j ? this.noise : 0)));
    this.KInv = matInverse(K);
    this.alpha = matVec(this.KInv, this.y);
  }
  predict(Xs) {
    const Ks = this.kernel(Xs, this.X);
    const mu = Ks.map(row => row.reduce((s, v, i) => s + v * this.alpha[i], 0) + this.yMean);
    const sigma = Ks.map(row => {
      const KInvRow = matVec(this.KInv, row);
      const quad = row.reduce((s, v, i) => s + v * KInvRow[i], 0);
      return Math.sqrt(Math.max(Math.pow(this.sigmaF, 2) - quad, 1e-12));
    });
    return { mu, sigma };
  }
}

function makeRng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function initBO(problem, nInit, rng) {
  const X = [], evals = [];
  for (let i = 0; i < nInit; i++) {
    const d = problem.dBounds[0] + rng() * (problem.dBounds[1] - problem.dBounds[0]);
    const bf = problem.bfBounds[0] + rng() * (problem.bfBounds[1] - problem.bfBounds[0]);
    X.push([d, bf]);
    evals.push(proxyEvaluate(d, bf, problem));
  }
  return { X, y: evals.map(e => e.objective), evals };
}

function stepBO(state, problem, nCandidates, kappa, rng) {
  const lengthScale = Math.max(
    problem.dBounds[1] - problem.dBounds[0],
    problem.bfBounds[1] - problem.bfBounds[0]
  ) / 4.0;
  const gp = new SimpleGP(lengthScale);
  gp.fit(state.X, state.y);

  const candidates = [];
  for (let i = 0; i < nCandidates; i++) {
    const d = problem.dBounds[0] + rng() * (problem.dBounds[1] - problem.dBounds[0]);
    const bf = problem.bfBounds[0] + rng() * (problem.bfBounds[1] - problem.bfBounds[0]);
    candidates.push([d, bf]);
  }
  const { mu, sigma } = gp.predict(candidates);
  let bestIdx = 0, bestLcb = Infinity;
  for (let i = 0; i < candidates.length; i++) {
    const lcb = mu[i] - kappa * sigma[i];
    if (lcb < bestLcb) { bestLcb = lcb; bestIdx = i; }
  }
  const [d, bf] = candidates[bestIdx];
  const e = proxyEvaluate(d, bf, problem);
  state.X.push([d, bf]);
  state.y.push(e.objective);
  state.evals.push(e);
  return e;
}

function nearestSection(library, d, bf) {
  let best = null, bestDist = Infinity;
  library.forEach(s => {
    const dist = Math.hypot(s.h - d, s.b - bf);
    if (dist < bestDist) { bestDist = dist; best = s; }
  });
  return best;
}

/* ============================================================================
   BUILT-UP SECTION PROPERTY CALCULATOR (PRD Section 7.4)
   Doubly-symmetric welded I-section, H x B x tw x tf, with 4 flange-web
   fillet welds of minimum leg size z (2 per flange, top+bottom). Weld
   fillets are included via parallel-axis theorem; own-centroidal inertia
   of each triangular fillet uses the standard right-triangle formula
   z^4/36. The design throat thickness a = 0.7z is a weld-strength
   dimension (perpendicular distance across the weld throat) -- it does
   NOT replace z in these formulas, since the deposited weld-metal
   triangle's cross-sectional geometry is defined by its leg size, not
   its throat. a is computed and displayed in the UI for reference only.
   Cw is reported two ways: Cw (screening) reuses the whole-section Iy
   (flanges+web+welds) x (h-tf)^2/4, matching the LTB screen above for
   consistency across this deliverable -- NOTE this is NON-conservative
   (it overstates warping rigidity and therefore Mcr) because Cw enters
   Mcr with a positive sign. Cw (flange-only) uses the classical closed
   form Cw = Iyf*ho^2/2 (Iyf = flange-only weak-axis inertia, ho = flange
   centroid spacing = H-tf), which drops the web/weld contribution to Iy
   and is the correct, conservative value for a final LTB check. J uses
   the standard open thin-wall sum (weld metal excluded, conservative).
   ========================================================================= */
function builtUpProperties(H, B, tw, tf, z) {
  const dz = tw / 2 + z / 3;
  const dy = (H / 2 - tf) - z / 3;
  const fArea = (z * z) / 2;

  const A = 2 * B * tf + (H - 2 * tf) * tw + 4 * fArea; // mm^2
  const weight = A * 7.85e-6 * 1000; // kg/m

  const IxBase = (B * Math.pow(H, 3)) / 12 - ((B - tw) * Math.pow(H - 2 * tf, 3)) / 12;
  const IxWeld = 4 * (Math.pow(z, 4) / 36 + fArea * dy * dy);
  const Ix = IxBase + IxWeld; // mm^4

  const IyFlange = 2 * ((tf * Math.pow(B, 3)) / 12); // mm^4, flanges only (no web, no weld)
  const IyBase = IyFlange + ((H - 2 * tf) * Math.pow(tw, 3)) / 12;
  const IyWeld = 4 * (Math.pow(z, 4) / 36 + fArea * dz * dz);
  const Iy = IyBase + IyWeld; // mm^4

  const Sx = Ix / (H / 2), Sy = Iy / (B / 2);
  const Zx = B * tf * (H - tf) + (tw * Math.pow(H - 2 * tf, 2)) / 4 + 2 * z * z * dy;
  const Zy = (Math.pow(B, 2) * tf) / 2 + (Math.pow(tw, 2) * (H - 2 * tf)) / 4 + 2 * z * z * dz;
  const ix = Math.sqrt(Ix / A), iy = Math.sqrt(Iy / A);
  const Cw = Iy * Math.pow(H - tf, 2) / 4; // mm^6, whole-section-Iy screening approximation (non-conservative)
  const CwFlange = IyFlange * Math.pow(H - tf, 2) / 4; // mm^6, flange-only closed form -- use for final LTB checks
  const J = (1 / 3) * (2 * B * Math.pow(tf, 3) + (H - 2 * tf) * Math.pow(tw, 3)); // mm^4, weld excluded
  const Av = (H - 2 * tf) * tw; // mm^2, clear-web shear area

  return { A, weight, Ix, Iy, Sx, Sy, Zx, Zy, ix, iy, Cw, CwFlange, J, Av };
}

/* ============================================================================
   ROLLED SECTION PROPERTY CALCULATOR
   Same doubly-symmetric idealization and process as builtUpProperties()
   above (base rectangle Ix/Iy minus the web notch, plus 4 flange-web
   fillet contributions via parallel-axis theorem), but the fillet is the
   rolled-shape root radius r (K-area), not a welded bead. A rolled root
   fillet is CONCAVE: each of the 4 corners is filled by the region inside
   a square of side r but OUTSIDE the inscribed quarter-circle of radius r
   tangent to both the flange and web faces (the "spandrel" between a
   sharp square corner and the rounding arc) -- smaller and more
   corner-concentrated than the weld's full right-triangle fillet.
   Closed-form spandrel properties (area, and its own centroid measured
   from the flange/web corner along each face) derived here by direct
   double-integration over the region:
     Af    = r^2 * (4 - pi) / 4                          ~= 0.2146 r^2
     c     = r * (10 - 3*pi) / (3 * (4 - pi))             ~= 0.2234 r
     Iown  = r^4 * (176 - 84*pi + 9*pi^2) / (144*(4-pi))  ~= 0.00754 r^4
   (Iown is the spandrel's second moment about its own centroidal axis,
   parallel to a face -- the direct analog of the weld triangle's z^4/36.)
   As with builtUpProperties, J excludes the fillet (thin-wall, flange+web
   only, conservative) and Cw is reported both ways (screening vs.
   flange-only) for the same reasons.
   ========================================================================= */
function rolledProperties(H, B, tw, tf, r) {
  const Af = (r * r) * (4 - Math.PI) / 4;
  const c = r * (10 - 3 * Math.PI) / (3 * (4 - Math.PI));
  const Iown = Math.pow(r, 4) * (176 - 84 * Math.PI + 9 * Math.PI * Math.PI) / (144 * (4 - Math.PI));
  const dz = tw / 2 + c;
  const dy = (H / 2 - tf) - c;

  const A = 2 * B * tf + (H - 2 * tf) * tw + 4 * Af; // mm^2
  const weight = A * 7.85e-6 * 1000; // kg/m

  const IxBase = (B * Math.pow(H, 3)) / 12 - ((B - tw) * Math.pow(H - 2 * tf, 3)) / 12;
  const IxFillet = 4 * (Iown + Af * dy * dy);
  const Ix = IxBase + IxFillet; // mm^4

  const IyFlange = 2 * ((tf * Math.pow(B, 3)) / 12); // mm^4, flanges only (no web, no fillet)
  const IyBase = IyFlange + ((H - 2 * tf) * Math.pow(tw, 3)) / 12;
  const IyFillet = 4 * (Iown + Af * dz * dz);
  const Iy = IyBase + IyFillet; // mm^4

  const Sx = Ix / (H / 2), Sy = Iy / (B / 2);
  const Zx = B * tf * (H - tf) + (tw * Math.pow(H - 2 * tf, 2)) / 4 + 4 * Af * dy;
  const Zy = (Math.pow(B, 2) * tf) / 2 + (Math.pow(tw, 2) * (H - 2 * tf)) / 4 + 4 * Af * dz;
  const ix = Math.sqrt(Ix / A), iy = Math.sqrt(Iy / A);
  const Cw = Iy * Math.pow(H - tf, 2) / 4; // mm^6, whole-section-Iy screening approximation (non-conservative)
  const CwFlange = IyFlange * Math.pow(H - tf, 2) / 4; // mm^6, flange-only closed form -- use for final LTB checks
  const J = (1 / 3) * (2 * B * Math.pow(tf, 3) + (H - 2 * tf) * Math.pow(tw, 3)); // mm^4, fillet excluded
  const Av = (H - 2 * tf) * tw; // mm^2, clear-web shear area

  return { A, weight, Ix, Iy, Sx, Sy, Zx, Zy, ix, iy, Cw, CwFlange, J, Av };
}

/* ============================================================================
   WORKED EXAMPLE -- Cw (screening) vs Cw (flange-only)
   Flagship section H-420x230x8x13, z=6mm (this tab's default inputs --
   open the Beam Section Properties tab, Built-Up mode, with no edits to
   reproduce these numbers).

   Inputs: H=420, B=230, tw=8, tf=13, z=6 mm  (throat a = 0.7z = 4.2 mm)
     dz = tw/2 + z/3 = 4 + 2            = 6 mm
     dy = (H/2-tf) - z/3 = 197 - 2      = 195 mm
     fArea = z^2/2                      = 18 mm^2
     ho = H - tf                        = 407 mm

   Iy (screening, flanges+web+4 welds):
     IyFlange = 2*tf*B^3/12             = 26,361,833 mm^4  (= 2636.18 cm^4)
     Iy,web   = (H-2tf)*tw^3/12         =     16,811 mm^4
     Iy,weld  = 4*(z^4/36 + fArea*dz^2) =      2,736 mm^4
     Iy       = IyFlange + Iy,web + Iy,weld
              = 26,381,380 mm^4         (= 2638.14 cm^4)
     -- for reference, catalog rolled H-420x230x8x13 lists Iy=2636 cm^4
        (KS_LIBRARY above), confirming this built-up Iy is in the right
        ballpark before the weld/web addition.

   Cw (screening)   = Iy       * ho^2 / 4
                     = 26,381,380 * 407^2 / 4
                     = 1,092,512,304 mm^6   (1.0925e12 mm^6 = 1,092,512 cm^6)

   Cw (flange-only) = IyFlange * ho^2 / 4
                     = 26,361,833 * 407^2 / 4
                     = 1,091,702,807 mm^6   (1.0917e12 mm^6 = 1,091,703 cm^6)

   Delta = Cw(screening) - Cw(flange-only) = 809,497 mm^6 = 0.074% of Cw(screening).
   For this wide-flange, thin-web geometry the two values are nearly
   identical -- the screening approximation is only marginally
   non-conservative here. The gap widens for stockier proportions (thicker
   web and/or larger z relative to B), where the web/weld share of Iy grows;
   always use Cw (flange-only) for a stamped-design LTB check regardless of
   how small the gap looks for any one geometry.

   ROLLED-BEAM VALIDATION -- rolledProperties() vs. plain rolled KS_LIBRARY
   entries (H-420x230x8x13 above is this project's *optimized built-up*
   flagship, not a standard mill shape, so it is a poor validation anchor
   for the rolled fillet model -- use ordinary square rolled columns
   instead). With r=13mm:
     H-200x200x8x12:  computed Ix=4715.6 cm^4 vs catalog 4720   (-0.09%)
                       computed Iy=1601.5 cm^4 vs catalog 1600  (+0.10%)
     H-300x300x10x15: computed Ix=20194.5 cm^4 vs catalog 20200 (-0.03%)
   Both back-solve to an implied root radius r~13mm from the catalog's A,
   matching the well-known real root radius for this KS/JIS shape family --
   independent confirmation the fillet area/centroid formulas are correct.
   Always confirm the actual root radius against the current KS D 3502 /
   EN 10365 / AISC producer table for the target shape before final design.
   ========================================================================= */

/* ============================================================================
   UI COMPONENTS
   ========================================================================= */

function FitDiagram({ holeDia, dNet, section, code, fits }) {
  const size = 300;
  const cx = size / 2, cy = size / 2;
  const scale = (size * 0.42) / (holeDia / 2);
  const rHole = (holeDia / 2) * scale;
  const rNet = (dNet / 2) * scale;
  let diagMM = 0, rectW = 0, rectH = 0;
  if (section) {
    if (code === "AISC") { diagMM = Math.hypot(section.d, section.bf) * MM_PER_IN; rectW = section.bf * MM_PER_IN; rectH = section.d * MM_PER_IN; }
    else { diagMM = Math.hypot(section.h, section.b); rectW = section.b; rectH = section.h; }
  }
  const rDiag = (diagMM / 2) * scale;
  const rectColor = fits ? "#3fbf6f" : "#e5534b";

  return (
    <div>
      <div className="svg-wrap">
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          <circle cx={cx} cy={cy} r={rHole} fill="none" stroke="#4fb3ff" strokeWidth="2" />
          <circle cx={cx} cy={cy} r={rNet} fill="none" stroke="#93a4b3" strokeWidth="1.5" strokeDasharray="5 4" />
          {section && (
            <>
              <circle cx={cx} cy={cy} r={rDiag} fill="none" stroke={rectColor} strokeWidth="1.5" strokeDasharray="2 3" opacity="0.8" />
              <rect x={cx - (rectW * scale) / 2} y={cy - (rectH * scale) / 2}
                    width={rectW * scale} height={rectH * scale}
                    fill={rectColor} fillOpacity="0.22" stroke={rectColor} strokeWidth="2" />
            </>
          )}
        </svg>
      </div>
      <div className="legend">
        <span><span className="swatch" style={{background:"#4fb3ff"}}></span>Drilled hole (D_hole)</span>
        <span><span className="swatch" style={{background:"#93a4b3"}}></span>Net fit boundary (D_net)</span>
        {section && <span><span className="swatch" style={{background:rectColor}}></span>Selected section + rotation envelope</span>}
      </div>
    </div>
  );
}

function UtilBar({ value }) {
  const pct = Math.min(value * 100, 100);
  const cls = value <= 0.85 ? "ok" : value <= 1.0 ? "warn" : "over";
  return (
    <div className="util-cell">
      <div className="util-bar-wrap"><div className={"util-bar " + cls} style={{ width: pct + "%" }}></div></div>
      <span>{value.toFixed(2)}</span>
    </div>
  );
}

function ConvergenceChart({ history }) {
  const [hover, setHover] = useState(null);
  const w = 560, h = 200, pad = { l: 44, r: 14, t: 10, b: 26 };
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;

  if (history.length === 0) {
    return <div className="empty-state">Run the optimizer to see the convergence trace.</div>;
  }

  const objs = history.map(p => p.objective);
  const yMax = Math.max(...objs), yMin = Math.min(0, Math.min(...objs));
  const yScale = v => pad.t + plotH - ((v - yMin) / (yMax - yMin || 1)) * plotH;
  const xScale = i => pad.l + (history.length === 1 ? 0 : (i / (history.length - 1)) * plotW);

  let runningMin = Infinity;
  const bestSoFar = history.map(p => { runningMin = Math.min(runningMin, p.objective); return runningMin; });
  const linePath = bestSoFar.map((v, i) => `${i === 0 ? "M" : "L"} ${xScale(i).toFixed(1)} ${yScale(v).toFixed(1)}`).join(" ");

  const gridYs = [0, 0.25, 0.5, 0.75, 1.0].map(f => yMin + f * (yMax - yMin));

  function onMove(evt) {
    const rect = evt.currentTarget.getBoundingClientRect();
    const x = evt.clientX - rect.left;
    const idx = Math.round(((x - pad.l) / plotW) * (history.length - 1));
    const clamped = Math.max(0, Math.min(history.length - 1, idx));
    setHover(clamped);
  }

  return (
    <div className="chart-card" onMouseLeave={() => setHover(null)}>
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} onMouseMove={onMove}>
        {gridYs.map((gy, i) => (
          <line key={i} className="chart-grid" x1={pad.l} x2={w - pad.r} y1={yScale(gy)} y2={yScale(gy)} />
        ))}
        <line className="chart-baseline" x1={pad.l} x2={pad.l} y1={pad.t} y2={h - pad.b} />
        <line className="chart-baseline" x1={pad.l} x2={w - pad.r} y1={h - pad.b} y2={h - pad.b} />
        {gridYs.map((gy, i) => (
          <text key={i} className="chart-axis-label" x={pad.l - 6} y={yScale(gy) + 3} textAnchor="end">{gy.toFixed(0)}</text>
        ))}
        <text className="chart-axis-label" x={pad.l} y={h - 6}>iter 0</text>
        <text className="chart-axis-label" x={w - pad.r} y={h - 6} textAnchor="end">iter {history.length - 1}</text>

        {history.map((p, i) => (
          <circle key={i} cx={xScale(i)} cy={yScale(p.objective)} r="2.5"
                  fill={p.feasible ? "#3fbf6f" : "#e5534b"} opacity="0.55" />
        ))}
        <path d={linePath} fill="none" stroke="#4fb3ff" strokeWidth="2" />
        {bestSoFar.map((v, i) => (
          (i === 0 || v < bestSoFar[i - 1]) &&
          <circle key={"b" + i} cx={xScale(i)} cy={yScale(v)} r="3.5" fill="#4fb3ff" />
        ))}

        {hover !== null && (
          <line x1={xScale(hover)} x2={xScale(hover)} y1={pad.t} y2={h - pad.b}
                stroke="#93a4b3" strokeWidth="1" strokeDasharray="3 3" />
        )}
      </svg>
      {hover !== null && (
        <div className="chart-tooltip" style={{ left: Math.min(xScale(hover) + 8, w - 170), top: 8 }}>
          <b>Iteration {hover}</b><br />
          d={history[hover].design.d.toFixed(0)} mm, bf={history[hover].design.bf.toFixed(0)} mm<br />
          weight={history[hover].design.weight.toFixed(1)} kg/m, obj={history[hover].objective.toFixed(1)}<br />
          {history[hover].feasible ? <span style={{ color: "#3fbf6f" }}>feasible</span> : <span style={{ color: "#e5534b" }}>infeasible</span>}
        </div>
      )}
      <div className="chart-legend">
        <span className="mk"><span className="swatch" style={{ background: "#4fb3ff" }}></span>Best-so-far (objective)</span>
        <span className="mk"><span className="swatch" style={{ background: "#3fbf6f" }}></span>Feasible sample</span>
        <span className="mk"><span className="swatch" style={{ background: "#e5534b" }}></span>Infeasible sample (penalized)</span>
      </div>
    </div>
  );
}

function ScatterChart({ history, dBounds, bfBounds, best }) {
  const [hover, setHover] = useState(null);
  const w = 400, h = 320, pad = { l: 46, r: 14, t: 14, b: 30 };
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;

  const xMin = dBounds[0], xMax = dBounds[1], yMin = bfBounds[0], yMax = bfBounds[1];
  const xScale = v => pad.l + ((v - xMin) / (xMax - xMin)) * plotW;
  const yScale = v => pad.t + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

  if (history.length === 0) {
    return <div className="empty-state">Run the optimizer to see sampled (d, bf) points.</div>;
  }

  return (
    <div className="chart-card" onMouseLeave={() => setHover(null)}>
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
        <rect x={pad.l} y={pad.t} width={plotW} height={plotH} fill="none" stroke="#2c3a48" strokeDasharray="4 3" />
        <line className="chart-baseline" x1={pad.l} x2={pad.l} y1={pad.t} y2={h - pad.b} />
        <line className="chart-baseline" x1={pad.l} x2={w - pad.r} y1={h - pad.b} y2={h - pad.b} />
        <text className="chart-axis-label" x={pad.l} y={h - 8}>d={xMin.toFixed(0)}</text>
        <text className="chart-axis-label" x={w - pad.r} y={h - 8} textAnchor="end">d={xMax.toFixed(0)}</text>
        <text className="chart-axis-label" x={pad.l - 6} y={h - pad.b + 3} textAnchor="end">bf={yMin.toFixed(0)}</text>
        <text className="chart-axis-label" x={pad.l - 6} y={pad.t + 8} textAnchor="end">bf={yMax.toFixed(0)}</text>

        {history.map((p, i) => (
          p.feasible ? (
            <circle key={i} cx={xScale(p.design.d)} cy={yScale(p.design.bf)} r={hover === i ? 6 : 4.5}
                    fill="#3fbf6f" fillOpacity="0.85" stroke="#0f1720" strokeWidth="1"
                    onMouseEnter={() => setHover(i)} />
          ) : (
            <g key={i} transform={`translate(${xScale(p.design.d)},${yScale(p.design.bf)})`}
               onMouseEnter={() => setHover(i)}>
              <line x1="-4" y1="-4" x2="4" y2="4" stroke="#e5534b" strokeWidth={hover === i ? 2.5 : 1.6} />
              <line x1="-4" y1="4" x2="4" y2="-4" stroke="#e5534b" strokeWidth={hover === i ? 2.5 : 1.6} />
            </g>
          )
        ))}
        {best && (
          <g transform={`translate(${xScale(best.design.d)},${yScale(best.design.bf)})`}>
            <circle r="9" fill="none" stroke="#e5a63f" strokeWidth="2" />
          </g>
        )}
      </svg>
      {hover !== null && (
        <div className="chart-tooltip" style={{ left: xScale(history[hover].design.d) + 10, top: yScale(history[hover].design.bf) }}>
          d={history[hover].design.d.toFixed(0)} mm, bf={history[hover].design.bf.toFixed(0)} mm<br />
          weight={history[hover].design.weight.toFixed(1)} kg/m<br />
          {history[hover].feasible ? "feasible" : "infeasible"}
        </div>
      )}
      <div className="chart-legend">
        <span className="mk"><span className="swatch" style={{ background: "#3fbf6f" }}></span>&#9679; Feasible</span>
        <span className="mk"><span className="swatch" style={{ background: "#e5534b" }}></span>&#10005; Infeasible</span>
        <span className="mk"><span className="swatch" style={{ background: "#e5a63f" }}></span>&#9711; Best found</span>
      </div>
    </div>
  );
}

function BayesianTab() {
  const [holeDia, setHoleDia] = useState(610);
  const [allowance, setAllowance] = useState(75);
  const [allowanceBasis, setAllowanceBasis] = useState("per_side");
  const [fy, setFy] = useState(355);
  const [mDemand, setMDemand] = useState(170);
  const [dLo, setDLo] = useState(150), [dHi, setDHi] = useState(600);
  const [bfLo, setBfLo] = useState(75), [bfHi, setBfHi] = useState(350);
  const [nInit, setNInit] = useState(8);
  const [nIter, setNIter] = useState(20);
  const [kappa, setKappa] = useState(2.0);
  const [seed, setSeed] = useState(42);
  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState(0);
  const [history, setHistory] = useState([]);
  const [showTable, setShowTable] = useState(false);

  const dNet = netDiagonal(holeDia, allowance, allowanceBasis);

  const best = useMemo(() => {
    if (history.length === 0) return null;
    const feasible = history.filter(e => e.feasible);
    const pool = feasible.length ? feasible : history;
    return pool.reduce((a, b) => (b.objective < a.objective ? b : a));
  }, [history]);

  async function run() {
    setRunning(true); setProgress(0); setHistory([]);
    const problem = {
      dNet, fy, mDemand,
      dBounds: [dLo, dHi], bfBounds: [bfLo, bfHi],
      penaltyWeight: 500,
    };
    const rng = makeRng(seed);
    const state = initBO(problem, nInit, rng);
    setHistory(state.evals.slice());
    await new Promise(r => setTimeout(r, 0));
    for (let it = 0; it < nIter; it++) {
      stepBO(state, problem, 1200, kappa, rng);
      setHistory(state.evals.slice());
      setProgress(it + 1);
      await new Promise(r => setTimeout(r, 40));
    }
    setRunning(false);
  }

  const nearestKS = best ? nearestSection(KS_LIBRARY, best.design.d, best.design.bf) : null;
  const nearestEN = best ? nearestSection(EN_LIBRARY, best.design.d, best.design.bf) : null;

  const tile = (k, v, u) => (
    <div className="prop-tile"><div className="k">{k}</div><div className="v">{v}<span className="u">{u}</span></div></div>
  );

  return (
    <div className="grid">
      <div className="panel">
        <h2>Phase 2 &mdash; Bayesian refinement</h2>
        <div className="note" style={{ marginTop: 0, marginBottom: 12 }}>
          Continuous (depth, flange width) search for a custom built-up section &mdash;
          for cases the Phase 1 catalog search can't reach, or where the standard
          catalog result looks inefficient (utilization well below 1.0 across the
          board). <b>Illustrative Phase 2 seed only</b>, not a production selection.
        </div>

        <div className="field">
          <label>Drilling hole diameter, D_hole (mm)</label>
          <input type="number" value={holeDia} onChange={e => setHoleDia(+e.target.value)} disabled={running} />
        </div>
        <div className="row">
          <div className="field">
            <label>Allowance, C (mm)</label>
            <input type="number" value={allowance} onChange={e => setAllowance(+e.target.value)} disabled={running} />
          </div>
          <div className="field">
            <label>Basis</label>
            <div className="toggle-group">
              <button className={allowanceBasis === "per_side" ? "active" : ""} disabled={running} onClick={() => setAllowanceBasis("per_side")}>D-2C</button>
              <button className={allowanceBasis === "total" ? "active" : ""} disabled={running} onClick={() => setAllowanceBasis("total")}>D-C</button>
            </div>
          </div>
        </div>
        <div className="small-muted" style={{ marginBottom: 12 }}>D_net = {dNet.toFixed(0)} mm</div>

        <div className="row">
          <div className="field">
            <label>Steel grade, fy (MPa)</label>
            <input type="number" value={fy} onChange={e => setFy(+e.target.value)} disabled={running} />
          </div>
          <div className="field">
            <label>Moment demand, M (kN&middot;m)</label>
            <input type="number" value={mDemand} onChange={e => setMDemand(+e.target.value)} disabled={running} />
          </div>
        </div>

        <div className="row">
          <div className="field">
            <label>Depth search box, d (mm)</label>
            <div className="row" style={{ gap: 6 }}>
              <input type="number" value={dLo} onChange={e => setDLo(+e.target.value)} disabled={running} />
              <input type="number" value={dHi} onChange={e => setDHi(+e.target.value)} disabled={running} />
            </div>
          </div>
        </div>
        <div className="row">
          <div className="field">
            <label>Flange width search box, bf (mm)</label>
            <div className="row" style={{ gap: 6 }}>
              <input type="number" value={bfLo} onChange={e => setBfLo(+e.target.value)} disabled={running} />
              <input type="number" value={bfHi} onChange={e => setBfHi(+e.target.value)} disabled={running} />
            </div>
          </div>
        </div>

        <div className="row">
          <div className="field">
            <label>Initial samples</label>
            <input type="number" value={nInit} onChange={e => setNInit(+e.target.value)} disabled={running} />
          </div>
          <div className="field">
            <label>BO iterations</label>
            <input type="number" value={nIter} onChange={e => setNIter(+e.target.value)} disabled={running} />
          </div>
          <div className="field">
            <label>Exploration &kappa;</label>
            <input type="number" step="0.1" value={kappa} onChange={e => setKappa(+e.target.value)} disabled={running} />
          </div>
        </div>

        <div className="run-bar">
          <button className="btn-primary" disabled={running} onClick={run}>
            {running ? "Running..." : "Run Bayesian refinement"}
          </button>
          <button className="btn-secondary" disabled={running} onClick={() => setSeed(Math.floor(Math.random() * 1e9))}>
            Randomize seed
          </button>
        </div>
        {running && (
          <div className="run-bar">
            <div className="progress-track"><div className="progress-fill" style={{ width: `${(progress / nIter) * 100}%` }}></div></div>
            <span className="small-muted">{progress}/{nIter}</span>
          </div>
        )}
      </div>

      <div>
        <div className="panel" style={{ marginBottom: 16 }}>
          <h2>Convergence &mdash; best objective vs. iteration</h2>
          <ConvergenceChart history={history} />
        </div>

        <div className="panel" style={{ marginBottom: 16 }}>
          <h2>Design space samples (d vs. bf)</h2>
          <ScatterChart history={history} dBounds={[dLo, dHi]} bfBounds={[bfLo, bfHi]} best={best} />
        </div>

        <div className="panel">
          <h2>Best design found</h2>
          {!best ? (
            <div className="empty-state">Run the optimizer to see a result.</div>
          ) : (
            <>
              <div className="prop-grid">
                {tile("Depth, d", best.design.d.toFixed(0), "mm")}
                {tile("Flange width, bf", best.design.bf.toFixed(0), "mm")}
                {tile("tf / tw (derived)", `${best.design.tf.toFixed(1)} / ${best.design.tw.toFixed(1)}`, "mm")}
                {tile("Weight", best.design.weight.toFixed(1), "kg/m")}
                {tile("Diagonal / D_net", `${best.design.diagonal.toFixed(0)} / ${dNet.toFixed(0)}`, "mm")}
                {tile("Mp (capacity)", best.MpKNm.toFixed(1), "kN·m")}
                {tile("Demand", mDemand.toFixed(1), "kN·m")}
                {tile("Feasible", best.feasible ? "Yes" : "No", "")}
              </div>
              <div className="note">
                Nearest standard catalog sections (Euclidean distance in h&times;b, not a
                capacity match &mdash; re-verify against Section 6):
                <br />&bull; KS: <b>{nearestKS.name}</b> ({nearestKS.mass.toFixed(1)} kg/m)
                <br />&bull; EN: <b>{nearestEN.name}</b> ({nearestEN.mass.toFixed(1)} kg/m)
              </div>
              <button className="btn-secondary" style={{ marginTop: 10 }} onClick={() => setShowTable(s => !s)}>
                {showTable ? "Hide" : "Show"} evaluation table ({history.length} samples)
              </button>
              {showTable && (
                <div className="table-scroll">
                  <table>
                    <thead>
                      <tr><th>#</th><th>d (mm)</th><th>bf (mm)</th><th>Weight (kg/m)</th><th>Mp (kN&middot;m)</th><th>Objective</th><th>Feasible</th></tr>
                    </thead>
                    <tbody>
                      {history.map((e, i) => (
                        <tr key={i} className={best === e ? "optimum" : ""}>
                          <td>{i}</td>
                          <td>{e.design.d.toFixed(0)}</td>
                          <td>{e.design.bf.toFixed(0)}</td>
                          <td>{e.design.weight.toFixed(1)}</td>
                          <td>{e.MpKNm.toFixed(1)}</td>
                          <td>{e.objective.toFixed(1)}</td>
                          <td>{e.feasible ? <span className="badge fit">YES</span> : <span className="badge nofit">NO</span>}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function OptimizerTab() {
  const [code, setCode] = useState("AISC");
  const [holeDia, setHoleDia] = useState(610);
  const [allowance, setAllowance] = useState(75);
  const [allowanceBasis, setAllowanceBasis] = useState("per_side");
  const [grade, setGrade] = useState("A992/Gr50");
  const [Mu, setMu] = useState(1500);
  const [Vu, setVu] = useState(30);
  const [Pu, setPu] = useState(0);
  const [LbConstruction, setLbConstruction] = useState(3048);
  const [LbService, setLbService] = useState(0);

  const meta = CODE_META[code];

  function onCodeChange(newCode) {
    setCode(newCode);
    const grades = Object.keys(CODE_META[newCode].grades);
    setGrade(grades[0]);
    if (newCode === "AISC") { setMu(1500); setVu(30); }
    else { setMu(170); setVu(130); }
  }

  const inp = useMemo(() => ({
    holeDia, allowance, allowanceBasis,
    fy: meta.grades[grade],
    Mu, Vu, Pu, MEd: Mu, VEd: Vu, NEd: Pu,
    LbConstruction, LbService,
  }), [holeDia, allowance, allowanceBasis, grade, Mu, Vu, Pu, LbConstruction, LbService, code]);

  const { dNet, results, admissible } = useMemo(() => optimize(code, inp), [code, inp]);
  const optimum = admissible.length ? admissible[0].section : null;

  return (

            Grid-searches H = 250&ndash;600mm (10mm steps) using the proportional

            weld leg z=6mm, evaluated via KS formulas &mdash; the same
            weld-inclusive builtUpProperties() model as the Beam Section

        <div className="field">

          <div className="field">

        <div className="field">

          {admissible.length === 0 ? (

              and passes every applicable strength check. Widen the hole, raise
              the allowance tier, reduce demand, or try the Built-Up option
              (grid-searches custom welded geometry) if you're currently on a
              fixed catalog code.
            </div>
          ) : (

    </div>
  );
}

function SectionPropertyTab() {

  const [r, setR] = useState(13);   // rolled: root fillet radius, mm (validated default -- see rolledProperties comment)

  const a = 0.7 * z; // derived throat thickness, mm -- display-only, does not feed section-property formulas

  const p = useMemo(
    () => (beamType === "rolled" ? rolledProperties(H, B, tw, tf, r) : builtUpProperties(H, B, tw, tf, z)),

      { Property: "Weight", Value: Number(p.weight.toFixed(2)), Unit: "kg/m" },

      { Property: "Sy", Value: Number((p.Sy / 1e3).toFixed(1)), Unit: "cm³" },

          {tile("Iy (weak)", (p.Iy / 1e4).toFixed(0), "cm⁴")}
          {tile("Sx", (p.Sx / 1e3).toFixed(0), "cm³")}

          {tile("Shape factor Zx/Sx", (p.Zx / p.Sx).toFixed(2), "")}

/* ============================================================================
   TWO-SERIES COMPARISON COMPONENTS (KS Rolled vs. Built-Up)
   Shared by the Cost Estimator tab's cost comparison and section-property
   comparison blocks below. Series colors are the dataviz-skill validated
   dark categorical slots 1 (blue) and 2 (orange) -- checked against this
   app's --panel surface (#17212c): CVD-safe adjacent pair, both clear the
   dark lightness band and 3:1 contrast floor.
   ========================================================================= */
const SERIES_KS = { name: "KS Rolled", color: "#3987e5" };
const SERIES_BU = { name: "Built-Up", color: "#d95926" };

// Builds and downloads a .xlsx workbook client-side (SheetJS, loaded via the
// CDN <script> tag above as the global XLSX). sheets: [{ name, rows }] where
// rows is an array of plain objects (json_to_sheet reads their keys as the
// header row). Sheet names are truncated to 31 chars -- the hard Excel limit.
function exportWorkbook(filename, sheets) {
  const wb = XLSX.utils.book_new();
  sheets.forEach(({ name, rows }) => {
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  });
  XLSX.writeFile(wb, filename);
}

// Converts a CompareTable rows array (same shape the table/chart consume)
// into flat {Metric, <seriesA>, <seriesB>, "Delta (%)"} objects for export
// -- numeric values kept as numbers (not the display-formatted strings) so
// the workbook stays usable for further calculation in Excel.
function compareRowsToSheet(rows, seriesA = SERIES_KS, seriesB = SERIES_BU) {
  return rows.map(r => {
    const deltaPct = r.a !== 0 ? ((r.b - r.a) / Math.abs(r.a)) * 100 : 0;
    return {
      Metric: r.unit ? `${r.label} (${r.unit})` : r.label,
      [seriesA.name]: Math.round(r.a * 1e4) / 1e4,
      [seriesB.name]: Math.round(r.b * 1e4) / 1e4,
      "Delta (%)": Math.round(deltaPct * 100) / 100,
    };
  });
}

// path for a bar with 4px-rounded top corners, square at the baseline
// (mark spec: "4px rounded data-end, square at the baseline")
function barPath(x, y, width, height, r = 4) {
  if (height <= 0) return "";
  const rr = Math.min(r, width / 2, height);
  return `M${x},${y + height} L${x},${y + rr} Q${x},${y} ${x + rr},${y} `
       + `L${x + width - rr},${y} Q${x + width},${y} ${x + width},${y + rr} `
       + `L${x + width},${y + height} Z`;
}

// round a max value up to a clean axis tick (1/2/5 x 10^n)
function niceMax(v) {
  if (v <= 0) return 1;
  const exp = Math.floor(Math.log10(v));
  const base = Math.pow(10, exp);
  const norm = v / base;
  const niceNorm = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  return niceNorm * base;
}

// Grouped column chart, two series, N categories. One linear y-axis --
// callers must pass values already on a common scale (e.g. all KRW, or
// all kg/m); never mix scales into one instance of this chart.
function GroupedBarChart({ data, seriesA = SERIES_KS, seriesB = SERIES_BU, valueFmt = String, yFmt = String }) {
  const [hover, setHover] = useState(null);
  const w = 560, h = 260, pad = { l: 72, r: 14, t: 14, b: 30 };
  const plotW = w - pad.l - pad.r, plotH = h - pad.t - pad.b;

  if (data.length === 0) return <div className="empty-state">No data to compare.</div>;

  const yMax = niceMax(Math.max(1e-9, ...data.flatMap(d => [d.a, d.b])));
  const yScale = v => pad.t + plotH - (v / yMax) * plotH;
  const groupW = plotW / data.length;
  const barW = Math.min(26, groupW * 0.3);
  const gap = 3;

  const bars = data.map((d, i) => {
    const cx = pad.l + i * groupW + groupW / 2;
    const xA = cx - barW - gap / 2, xB = cx + gap / 2;
    const yA = yScale(d.a), yB = yScale(d.b);
    return { ...d, cx, xA, xB, yA, yB, hA: (h - pad.b) - yA, hB: (h - pad.b) - yB };
  });
  const gridYs = [0, 0.25, 0.5, 0.75, 1.0].map(f => f * yMax);
  const hb = hover !== null ? bars[hover.i] : null;

  return (
    <div className="chart-card" onMouseLeave={() => setHover(null)}>
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
        {gridYs.map((gy, i) => (
          <line key={i} className="chart-grid" x1={pad.l} x2={w - pad.r} y1={yScale(gy)} y2={yScale(gy)} />
        ))}
        {gridYs.map((gy, i) => (
          <text key={i} className="chart-axis-label" x={pad.l - 8} y={yScale(gy) + 3} textAnchor="end">{yFmt(gy)}</text>
        ))}
        <line className="chart-baseline" x1={pad.l} x2={pad.l} y1={pad.t} y2={h - pad.b} />
        <line className="chart-baseline" x1={pad.l} x2={w - pad.r} y1={h - pad.b} y2={h - pad.b} />
        {bars.map((d, i) => (
          <g key={d.label}>
            <path d={barPath(d.xA, d.yA, barW, d.hA)} fill={seriesA.color}
                  opacity={hover && hover.i === i && hover.s !== "a" ? 0.55 : 1}
                  onMouseEnter={() => setHover({ i, s: "a" })} />
            <path d={barPath(d.xB, d.yB, barW, d.hB)} fill={seriesB.color}
                  opacity={hover && hover.i === i && hover.s !== "b" ? 0.55 : 1}
                  onMouseEnter={() => setHover({ i, s: "b" })} />
            <text className="chart-axis-label" x={d.cx} y={h - pad.b + 16} textAnchor="middle">{d.label}</text>
          </g>
        ))}
      </svg>
      {hb && (
        <div className="chart-tooltip" style={{ left: Math.min(hb.cx + 8, w - 150), top: (hover.s === "a" ? hb.yA : hb.yB) - 8 }}>
          <b>{hb.label}</b><br />
          {(hover.s === "a" ? seriesA.name : seriesB.name)}: {valueFmt(hover.s === "a" ? hb.a : hb.b)}
        </div>
      )}
      <div className="chart-legend">
        <span className="mk"><span className="swatch" style={{ background: seriesA.color }}></span>{seriesA.name}</span>
        <span className="mk"><span className="swatch" style={{ background: seriesB.color }}></span>{seriesB.name}</span>
      </div>
    </div>
  );
}

// Numeric side-by-side comparison table. direction:"lowerBetter" colors the
// delta (built-up cheaper/lighter = savings, green); direction:"neutral"
// (default) leaves the delta uncolored -- most section properties don't have
// a universally "better" direction outside the context of a specific demand.
function CompareTable({ rows, seriesA = SERIES_KS, seriesB = SERIES_BU }) {
  return (
    <table>
      <thead>
        <tr>
          <th>Metric</th>
          <th><span className="legend-key"><span className="swatch" style={{ background: seriesA.color }}></span>{seriesA.name}</span></th>
          <th><span className="legend-key"><span className="swatch" style={{ background: seriesB.color }}></span>{seriesB.name}</span></th>
          <th>&Delta; ({seriesB.name} vs {seriesA.name})</th>
        </tr>
      </thead>
      <tbody>
        {rows.map(r => {
          const deltaPct = r.a !== 0 ? ((r.b - r.a) / Math.abs(r.a)) * 100 : 0;
          const cls = r.direction === "lowerBetter" ? (deltaPct < -0.05 ? "delta-good" : deltaPct > 0.05 ? "delta-bad" : "") : "";
          const fmt = r.fmt || (v => v.toFixed(r.digits ?? 1));
          return (
            <tr key={r.label}>
              <td>{r.label}{r.unit ? <span className="small-muted"> ({r.unit})</span> : null}</td>
              <td>{fmt(r.a)}</td>
              <td>{fmt(r.b)}</td>
              <td className={cls}>{deltaPct >= 0 ? "+" : ""}{deltaPct.toFixed(1)}%</td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

// One metric, two horizontal bars, each scaled to that metric's own max --
// deliberately not a shared axis, since weight (kg/m) and Ix (cm^4) live on
// wildly different scales; this is the small-multiples escape from that.
function PairedBarTile({ label, unit, a, b, fmt, seriesA = SERIES_KS, seriesB = SERIES_BU }) {
  const max = Math.max(a, b, 1e-9);
  const f = fmt || (v => v.toFixed(1));
  return (
    <div className="pair-tile">
      <div className="k">{label}{unit ? ` (${unit})` : ""}</div>
      <div className="pair-row">
        <span className="pair-name">{seriesA.name}</span>
        <div className="pair-bar-wrap"><div className="pair-bar" style={{ width: (a / max) * 100 + "%", background: seriesA.color }}></div></div>
        <span className="pair-val">{f(a)}</span>
      </div>
      <div className="pair-row">
        <span className="pair-name">{seriesB.name}</span>
        <div className="pair-bar-wrap"><div className="pair-bar" style={{ width: (b / max) * 100 + "%", background: seriesB.color }}></div></div>
        <span className="pair-val">{f(b)}</span>
      </div>
    </div>
  );
}

/* ============================================================================
   COST ESTIMATOR (Korean market)
   Compares a KS_LIBRARY rolled H-shape against a free-parameter built-up
   beam on installed steel cost. Steel unit prices (KRW/ton) and fabrication
   cost (entered as a % ratio of material cost, per project convention --
   built-up defaults to 12%, mid of a documented 10-15% shop-welding range;
   rolled defaults to 0%, no figure specified for mill-rolled fabrication)
   are user-editable starting points, NOT a live market feed -- this tool has
   no price-lookup capability. Update both before relying on the result.
   ========================================================================= */
function CostEstimatorTab() {
  const [L, setL] = useState(6); // shared beam length, m

  const [ksName, setKsName] = useState("H-420x230x8x13");
  const [rolledPricePerTon, setRolledPricePerTon] = useState(700000); // KRW/ton
  const [rolledFabRatio, setRolledFabRatio] = useState(0); // %

  const [H, setH] = useState(420);
  const [B, setB] = useState(230);
  const [tw, setTw] = useState(8);
  const [tf, setTf] = useState(13);
  const [z, setZ] = useState(6);
  const [builtUpPricePerTon, setBuiltUpPricePerTon] = useState(600000); // KRW/ton
  const [builtUpFabRatio, setBuiltUpFabRatio] = useState(12); // %

  const ksSection = KS_LIBRARY.find(s => s.name === ksName) || KS_LIBRARY[0];
  const buProps = useMemo(() => builtUpProperties(H, B, tw, tf, z), [H, B, tw, tf, z]);

  function costOf(massKgPerM, pricePerTon, fabRatioPct) {
    const totalWeightKg = massKgPerM * L;
    const materialCost = totalWeightKg * (pricePerTon / 1000);
    const fabricationCost = materialCost * (fabRatioPct / 100);
    const totalCost = materialCost + fabricationCost;
    return { totalWeightKg, materialCost, fabricationCost, totalCost, costPerM: totalCost / L };
  }

  const ksCost = costOf(ksSection.mass, rolledPricePerTon, rolledFabRatio);
  const buCost = costOf(buProps.weight, builtUpPricePerTon, builtUpFabRatio);
  const weightSavingsPct = ksSection.mass > 0 ? ((ksSection.mass - buProps.weight) / ksSection.mass) * 100 : 0;
  const costSavingsPct = ksCost.totalCost > 0 ? ((ksCost.totalCost - buCost.totalCost) / ksCost.totalCost) * 100 : 0;

  const won = v => Math.round(v).toLocaleString("ko-KR");
  const tile = (k, v, u) => (
    <div className="prop-tile"><div className="k">{k}</div><div className="v">{v}<span className="u">{u}</span></div></div>
  );

  const costRows = [
    { label: "Weight", unit: "kg/m", a: ksSection.mass, b: buProps.weight, fmt: v => v.toFixed(1), direction: "lowerBetter" },
    { label: "Total weight", unit: "kg", a: ksCost.totalWeightKg, b: buCost.totalWeightKg, fmt: v => v.toFixed(0), direction: "lowerBetter" },
    { label: "Material cost", unit: "₩", a: ksCost.materialCost, b: buCost.materialCost, fmt: won, direction: "lowerBetter" },
    { label: "Fabrication cost", unit: "₩", a: ksCost.fabricationCost, b: buCost.fabricationCost, fmt: won, direction: "lowerBetter" },
    { label: "Total cost", unit: "₩", a: ksCost.totalCost, b: buCost.totalCost, fmt: won, direction: "lowerBetter" },
    { label: "Cost / m", unit: "₩/m", a: ksCost.costPerM, b: buCost.costPerM, fmt: won, direction: "lowerBetter" },
  ];
  const costChartData = [
    { label: "Material", a: ksCost.materialCost, b: buCost.materialCost },
    { label: "Fabrication", a: ksCost.fabricationCost, b: buCost.fabricationCost },
    { label: "Total", a: ksCost.totalCost, b: buCost.totalCost },
  ];

  const propRows = [
    { label: "Weight", unit: "kg/m", a: ksSection.mass, b: buProps.weight, fmt: v => v.toFixed(1) },
    { label: "Area, A", unit: "cm²", a: ksSection.A, b: buProps.A / 100, fmt: v => v.toFixed(1) },
    { label: "Ix (strong)", unit: "cm⁴", a: ksSection.Ix, b: buProps.Ix / 1e4, fmt: v => v.toFixed(0) },
    { label: "Iy (weak)", unit: "cm⁴", a: ksSection.Iy, b: buProps.Iy / 1e4, fmt: v => v.toFixed(0) },
    { label: "Sx (elastic)", unit: "cm³", a: ksSection.Sx, b: buProps.Sx / 1e3, fmt: v => v.toFixed(0) },
    { label: "Zx (plastic, approx.)", unit: "cm³", a: ksSection.Zx, b: buProps.Zx / 1e3, fmt: v => v.toFixed(0) },
    { label: "rx / ix", unit: "cm", a: ksSection.rx, b: buProps.ix / 10, fmt: v => v.toFixed(2) },
    { label: "ry / iy", unit: "cm", a: ksSection.ry, b: buProps.iy / 10, fmt: v => v.toFixed(2) },
  ];

  function handleExport() {
    const inputRows = [
      { Parameter: "Beam length, L (m)", Value: L },
      { Parameter: "KS section", Value: ksName },
      { Parameter: "KS steel unit price (₩/ton)", Value: rolledPricePerTon },
      { Parameter: "KS fabrication ratio (%)", Value: rolledFabRatio },
      { Parameter: "Built-up depth, H (mm)", Value: H },
      { Parameter: "Built-up flange width, B (mm)", Value: B },
      { Parameter: "Built-up web thickness, tw (mm)", Value: tw },
      { Parameter: "Built-up flange thickness, tf (mm)", Value: tf },
      { Parameter: "Built-up weld leg size, z (mm)", Value: z },
      { Parameter: "Built-up steel unit price (₩/ton)", Value: builtUpPricePerTon },
      { Parameter: "Built-up fabrication ratio (%)", Value: builtUpFabRatio },
    ];
    exportWorkbook(
      `CIP_Cost_Estimator_${ksName}_vs_BH-${H}x${B}x${tw}x${tf}.xlsx`,
      [
        { name: "Inputs", rows: inputRows },
        { name: "Cost Comparison", rows: compareRowsToSheet(costRows) },
        { name: "Section Properties", rows: compareRowsToSheet(propRows) },
      ]
    );
  }

  return (
    <div>
      <div className="panel" style={{ marginBottom: 16 }}>
        <div className="head-row">
          <h2>Shared inputs</h2>
          <button className="btn-secondary" onClick={handleExport}>Export to Excel</button>
        </div>
        <div className="field">
          <label>Beam length, L (m)</label>
          <input type="number" value={L} onChange={e => setL(+e.target.value)} />
        </div>
        <div className="note">
          Korean-market installed-cost comparison, KS rolled H-shape vs.
          built-up welded I-section. Steel unit prices and fabrication ratios
          below are user-editable starting points, not live market data --
          update them with current quotes before relying on the result. Per
          project scope, this tab is a working scaffold to be finalized once
          the final KS-vs-built-up beam selection is made.
        </div>
      </div>

      <div className="grid">
        <div className="panel">
          <h2>KS rolled beam &mdash; inputs</h2>
          <div className="field">
            <label>Section</label>
            <select value={ksName} onChange={e => setKsName(e.target.value)}>
              {KS_LIBRARY.map(s => <option key={s.name} value={s.name}>{s.name} ({s.mass} kg/m)</option>)}
            </select>
          </div>
          <div className="field">
            <label>Steel unit price (₩/ton)</label>
            <input type="number" value={rolledPricePerTon} onChange={e => setRolledPricePerTon(+e.target.value)} />
          </div>
          <div className="field">
            <label>Fabrication cost, ratio of material (%)</label>
            <input type="number" value={rolledFabRatio} onChange={e => setRolledFabRatio(+e.target.value)} />
          </div>
        </div>

        <div className="panel">
          <h2>Built-up beam &mdash; inputs</h2>
          <div className="field"><label>Depth, H (mm)</label><input type="number" value={H} onChange={e => setH(+e.target.value)} /></div>
          <div className="field"><label>Flange width, B (mm)</label><input type="number" value={B} onChange={e => setB(+e.target.value)} /></div>
          <div className="row">
            <div className="field"><label>Web thickness, tw (mm)</label><input type="number" value={tw} onChange={e => setTw(+e.target.value)} /></div>
            <div className="field"><label>Flange thickness, tf (mm)</label><input type="number" value={tf} onChange={e => setTf(+e.target.value)} /></div>
          </div>
          <div className="field"><label>Min. weld leg size, z (mm)</label><input type="number" value={z} onChange={e => setZ(+e.target.value)} /></div>
          <div className="field">
            <label>Steel unit price (₩/ton)</label>
            <input type="number" value={builtUpPricePerTon} onChange={e => setBuiltUpPricePerTon(+e.target.value)} />
          </div>
          <div className="field">
            <label>Fabrication cost, ratio of material (%) &mdash; shop welding</label>
            <input type="number" value={builtUpFabRatio} onChange={e => setBuiltUpFabRatio(+e.target.value)} />
          </div>
        </div>
      </div>

      <div className="panel" style={{ marginTop: 16 }}>
        <h2>Cost comparison</h2>
        <div className="stat-row">
          {tile("Weight savings (built-up vs. KS)", weightSavingsPct.toFixed(1), "%")}
          {tile("Cost savings (built-up vs. KS)", costSavingsPct.toFixed(1), "%")}
        </div>
        <div className="compare-layout">
          <div className="table-scroll" style={{ maxHeight: "none" }}>
            <CompareTable rows={costRows} />
          </div>
          <GroupedBarChart data={costChartData} valueFmt={v => "₩" + won(v)} yFmt={v => won(v)} />
        </div>
      </div>

      <div className="panel" style={{ marginTop: 16 }}>
        <h2>Section properties comparison</h2>
        <div className="note" style={{ marginTop: 0 }}>
          {ksName} vs. the built-up geometry entered above ({H}&times;{B}&times;{tw}&times;{tf}, z={z}mm).
          Not colored as savings &mdash; unlike cost/weight, a smaller section property
          isn't inherently better; check against the governing demand (Section
          6 in the PRD / OptimizerTab) before drawing conclusions.
        </div>
        <div className="compare-layout">
          <div className="table-scroll" style={{ maxHeight: "none" }}>
            <CompareTable rows={propRows} />
          </div>
          <div>
            <div className="chart-legend" style={{ marginBottom: 6 }}>
              <span className="mk"><span className="swatch" style={{ background: SERIES_KS.color }}></span>{SERIES_KS.name}</span>
              <span className="mk"><span className="swatch" style={{ background: SERIES_BU.color }}></span>{SERIES_BU.name}</span>
            </div>
            <div className="pair-grid">
              {propRows.map(r => (
                <PairedBarTile key={r.label} label={r.label} unit={r.unit} a={r.a} b={r.b} fmt={r.fmt} />
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("optimizer");
  return (
    <div>
      <h1>CIP Beam Optimizer</h1>
      <div className="subtitle">
        Steel beam selection for cast-in-place drilled-hole applications &mdash; geometric fit
        + AISC 360 / EN 1993-1-1 / KS dual-code capacity checks. Screening tool; not a
        substitute for a stamped structural calculation package.
      </div>
      <div className="tabs">
        <button className={"tab-btn" + (tab === "optimizer" ? " active" : "")} onClick={() => setTab("optimizer")}>CIP Beam Optimizer</button>
        <button className={"tab-btn" + (tab === "props" ? " active" : "")} onClick={() => setTab("props")}>Beam Section Properties</button>
        <button className={"tab-btn" + (tab === "cost" ? " active" : "")} onClick={() => setTab("cost")}>Cost Estimator (KR)</button>
        <button className={"tab-btn" + (tab === "bayesian" ? " active" : "")} onClick={() => setTab("bayesian")}>Bayesian Refinement (Phase 2)</button>
      </div>
      {tab === "optimizer" && <OptimizerTab />}
      {tab === "props" && <SectionPropertyTab />}
      {tab === "cost" && <CostEstimatorTab />}
      {tab === "bayesian" && <BayesianTab />}
      <div className="footer-note">
        Companion files: optimized_beam_aisc.py &middot; optimized_steel_beam.py &middot;
        bayesian_optimization.py &middot; CIPBeamOptimizer.jsx. Section property tables are
        indicative &mdash; verify against the current AISC Steel Construction Manual / EN 10365
        / KS D 3502 producer tables before final design.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
